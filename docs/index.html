<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Nubia · 5E</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Alegreya:wght@400;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- los seis colores de la paleta ---- */
  --p-azul:#104186; --p-medio:#3566AB; --p-claro:#82B8DE;
  --p-hueso:#F1F1F1; --p-gris:#808080; --p-carbon:#1C1C1C;

  /* ---- superficies ---- */
  --fondo:#F1F1F1; --arena-hueso:#FFFFFF; --arena:#DCE8F4; --borde:#BCD2E6;

  /* ---- texto, con contraste medido sobre las superficies de arriba ---- */
  --txt:#1C1C1C;      /* 15.1 : 1 */
  --txt-2:#4A5F78;    /*  6.0 : 1 */
  --txt-3:#6B6B6B;    /*  4.8 : 1 */
  --titulo:#104186;   /*  8.8 : 1 */

  /* ---- estructura y acentos ---- */
  --tinta:#104186; --tinta-suave:#4A5F78; --mar:#2F5E9E;
  --oro:#82B8DE;            /* solo sobre fondo oscuro */
  --fucsia:#3566AB; --selva:#2E8B57; --peligro:#C0392B;
  --gris:#6B6B6B; --carbon:#1C1C1C;
  --sobre-oscuro:#FFFFFF;   /* texto encima de las cajas azul profundo */
  --sombra:rgba(16,65,134,.13);
  --elev-1:0 1px 3px rgba(16,65,134,.10), 0 1px 2px rgba(16,65,134,.06);
  --elev-2:0 3px 10px rgba(16,65,134,.11), 0 1px 3px rgba(16,65,134,.07);
  --elev-3:0 8px 26px rgba(16,65,134,.15), 0 2px 6px rgba(16,65,134,.08);
  --r-s:7px; --r-m:11px; --r-l:15px;
}

/* ===================== MODO OSCURO ===================== */
html[data-tema="oscuro"]{
  --fondo:#131B26; --arena-hueso:#1B2838; --arena:#223246; --borde:#32486629;

  --txt:#ECF2F8;      /* 13.8 : 1 sobre el panel */
  --txt-2:#A9C4DC;    /*  8.3 : 1 */
  --txt-3:#8FA6BC;    /*  6.3 : 1 */
  --titulo:#8FC2EA;   /*  7.9 : 1 */

  --tinta:#1E3A5F; --tinta-suave:#A9C4DC; --mar:#8FC2EA;
  --oro:#9FD0F0;
  --fucsia:#2E6FC4; --selva:#2E8B57; --peligro:#C0392B;
  --gris:#8FA6BC; --carbon:#ECF2F8;
  --sobre-oscuro:#FFFFFF;
  --sombra:rgba(0,0,0,.5);
  --elev-1:0 1px 3px rgba(0,0,0,.4);
  --elev-2:0 3px 12px rgba(0,0,0,.45);
  --elev-3:0 10px 30px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--txt);
  font-family:'Alegreya',Georgia,serif;font-size:17px;line-height:1.6;
  display:flex;flex-direction:column;min-height:100%}

/* La portada mantiene su banda azul profunda en los dos modos: es la
   entrada del sitio y el logo necesita fondo oscuro para destacar. */
.hero{background:#104186;color:#fff;
  background-image:radial-gradient(circle at 18% 10%, #16539F 0%, transparent 46%),
                   radial-gradient(circle at 84% 80%, #0B2F63 0%, transparent 52%)}
html[data-tema="oscuro"] .hero{background:#0D3268;
  background-image:radial-gradient(circle at 18% 10%, #15468A 0%, transparent 46%),
                   radial-gradient(circle at 84% 80%, #07203F 0%, transparent 52%)}
.hero .marca{color:#9FD0F0!important}
.hero h1{color:#fff!important}
.hero h1 span{color:#9FD0F0!important}
.hero p{color:#D7E6F4!important}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px;width:100%}
h1,h2,h3{font-family:'Silkscreen','Courier New',monospace;line-height:1.25}
.vueltiao{height:12px;flex:0 0 auto;background:
  repeating-linear-gradient(135deg,var(--oro) 0 7px,transparent 7px 14px),
  repeating-linear-gradient(45deg,var(--oro) 0 7px,var(--tinta) 7px 14px)}

@keyframes surgir{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes brotar{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes girar{to{transform:rotate(360deg)}}


.hero{padding:52px 0 36px;text-align:center;flex:0 0 auto;animation:surgir .4s ease both}
.hero .marca{font-family:'Silkscreen',monospace;font-size:11px;color:var(--txt-2);letter-spacing:.16em}
.hero h1{font-size:clamp(34px,8.4vw,68px);margin:12px 0 0}
.hero h1 span{color:var(--oro);display:block}
.hero p{max-width:52ch;margin:16px auto 0;color:var(--txt-2);font-size:16px}
main{flex:1 0 auto;padding:16px 0 56px}

.sesion{background:var(--arena-hueso);color:var(--titulo);border:3px solid var(--oro);
  box-shadow:0 14px 40px rgba(0,0,0,.42);padding:26px;max-width:460px;margin:0 auto;
  text-align:center;animation:brotar .35s ease both}
.sesion h2{font-size:14px;margin:0 0 8px;color:var(--mar)}
.sesion p{margin:0 0 20px;font-size:16px;color:var(--txt-2)}
.google{display:inline-flex;align-items:center;gap:11px;font-family:'Silkscreen',monospace;
  font-size:12px;padding:14px 20px;border:2px solid var(--tinta);background:var(--arena-hueso);color:var(--titulo);
  cursor:pointer;box-shadow:5px 5px 0 var(--tinta);transition:transform .1s,box-shadow .12s,background .14s}
.google:hover{background:#fff8e8}
.google:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--tinta)}
.google svg{width:20px;height:20px}

.usuario{display:flex;align-items:center;gap:13px;justify-content:space-between;flex-wrap:wrap;
  background:var(--tinta2);border:3px solid var(--oro);padding:12px 16px;margin-bottom:26px;
  animation:surgir .3s ease both}
.usuario .quien{display:flex;align-items:center;gap:11px}
.usuario img{width:38px;height:38px;border:2px solid var(--oro);object-fit:cover}
.usuario b{font-family:'Silkscreen',monospace;font-size:12px;color:var(--sobre-oscuro)}
.usuario small{display:block;font-family:'Alegreya Sans',sans-serif;font-size:12px;color:var(--txt-2)}

button{font-family:'Silkscreen',monospace;cursor:pointer}
.bt{font-size:10px;padding:10px 13px;border:2px solid var(--oro);background:transparent;color:var(--oro);
  transition:background .14s,color .14s,transform .08s}
.bt:hover{background:var(--oro);color:var(--titulo)}
.bt:active{transform:translateY(1px)}
.bt.solido{background:var(--fucsia);border-color:var(--fucsia);color:#fff}
.bt.solido:hover{background:#2B548C;color:#fff}
.bt:disabled{opacity:.45;cursor:not-allowed}
input{font-family:'Silkscreen',monospace;font-size:14px;padding:11px 12px;border:2px solid var(--tinta);
  background:var(--arena-hueso);color:var(--titulo);width:100%}
input:focus-visible{outline:3px solid var(--fucsia);outline-offset:2px}
code{background:#0d1f31;padding:2px 6px;color:var(--txt-2);font-size:13px}

.acciones{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:30px}
@media(max-width:700px){.acciones{grid-template-columns:1fr}}
.accion{background:var(--arena-hueso);color:var(--titulo);border:2px solid var(--tinta);
  box-shadow:var(--elev-2);padding:20px;animation:surgir .34s ease both}
.accion:nth-child(2){animation-delay:.07s}
.accion h3{font-size:13px;margin:0 0 4px;color:var(--mar)}
.accion p{margin:0 0 14px;font-size:15px;color:var(--txt-2)}
.accion .fila{display:flex;gap:9px}
.accion .fila input{flex:1}

h2.sec{font-size:13px;color:var(--txt-2);margin:0 0 14px;letter-spacing:.06em}
.mesas{display:grid;gap:13px}
.mesa{background:var(--arena-hueso);color:var(--titulo);border:2px solid var(--tinta);
  display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:15px 17px;
  box-shadow:var(--elev-2);animation:surgir .3s ease both;
  transition:transform .16s,box-shadow .16s}
.mesa:hover{transform:translateY(-3px);box-shadow:var(--elev-2)}
@media(max-width:640px){.mesa{grid-template-columns:1fr}}
.codigo{font-family:'Silkscreen',monospace;font-size:20px;letter-spacing:.12em;
  background:var(--tinta);color:var(--oro);padding:12px 14px;white-space:nowrap;text-align:center}
.mesa h3{font-size:14px;margin:0}
.mesa .meta{font-family:'Alegreya Sans',sans-serif;font-size:13px;color:var(--txt-2);margin-top:3px}
.rol{display:inline-block;font-family:'Silkscreen',monospace;font-size:9px;padding:3px 6px;
  background:var(--fucsia);color:#fff;margin-left:7px;vertical-align:2px}
.rol.dm{background:var(--oro);color:var(--titulo)}
.mesa .btns{display:flex;gap:8px;flex-wrap:wrap}

.vacio{background:rgba(253,246,230,.06);border:3px dashed #4d7183;padding:28px 20px;text-align:center;
  color:var(--txt-3);font-family:'Alegreya Sans',sans-serif;font-size:14px}
.aviso{background:#3a1420;border:3px solid var(--fucsia);color:#ffd9e4;padding:14px 16px;
  margin-bottom:22px;font-family:'Alegreya Sans',sans-serif;font-size:14px;animation:surgir .25s ease both}
.aviso b{color:#fff}
.cargando{display:inline-block;width:15px;height:15px;border:3px solid #4d7183;
  border-top-color:var(--oro);border-radius:50%;animation:girar .7s linear infinite;vertical-align:-2px}

.herr{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
.herr a{display:block;text-decoration:none;background:var(--tinta2);border:2px solid #4d7183;
  padding:14px;color:var(--sobre-oscuro);transition:border-color .14s,transform .14s,background .14s}
.herr a:hover{border-color:var(--oro);transform:translateY(-2px);background:#204468}
.herr b{font-family:'Silkscreen',monospace;font-size:11px;display:block;color:var(--titulo);margin-bottom:3px}
.herr span{font-family:'Alegreya Sans',sans-serif;font-size:13px;color:var(--txt-2)}

footer{flex:0 0 auto;padding:22px 0 30px;color:var(--txt-3);text-align:center;
  font-family:'Alegreya Sans',sans-serif;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.logo{width:34px;height:34px;image-rendering:auto;display:block;flex:0 0 auto}
.logo-grande{width:104px;height:104px;image-rendering:auto;display:block;margin:0 auto 6px;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));animation:brotar .45s ease both}
header h1,.hero h1{display:flex;align-items:center;gap:12px}
.hero h1{display:block}

/* ---- pulido compartido con el tablero ---- */
body{background:var(--fondo)}
.bt,button.bt{border-radius:var(--r-s)}
.card,.lider,.cl,.tilewrap,.caja2,.panel,.box{border-radius:var(--r-m)}
input,select,textarea{border-radius:var(--r-s);border:1px solid #BCD2E6;padding:9px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mar);
  box-shadow:0 0 0 3px rgba(53,102,171,.16)}

body{background:var(--fondo)}
.bt,button.bt{border-radius:var(--r-s)}
.card,.lider,.cl,.tilewrap,.panel,.box{border-radius:var(--r-m)}
input,select,textarea{border-radius:var(--r-s);border:1px solid #BCD2E6;padding:9px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mar);
  box-shadow:0 0 0 3px rgba(53,102,171,.16)}

body{background:var(--fondo);color:var(--txt)}
p,li,td,dd,blockquote,.desc,.act{color:var(--txt)}
.nota,.sub2,.pcpie,small,figcaption{color:var(--txt-3)}
h1,h2,h3,h4,h5,summary,label,legend{color:var(--titulo)}
.eyeb,.campo>span,.cl span,.lead{color:var(--txt-2)}
a{color:var(--mar)}

/* Sobre las cajas azul profundo el texto siempre es claro */
header,header *,.cab,.cab *,.orden,.orden *,.saldo,.cartera,.cartera *,
.premio,.destino,.destino span,#railDinero,.jug b,.jug span{color:var(--sobre-oscuro)}
header .eyeb,.cartera span{color:var(--oro)}

/* ---- superficies en ambos modos ---- */
.acc,.card,.lider,.panel,.box,.mapa-caja,.cl{background:var(--arena-hueso);border-color:var(--borde)}
.acc[open]>summary{background:var(--arena);border-bottom-color:var(--borde)}
.acc>summary:hover{background:var(--arena)}
input,select,textarea{background:var(--arena-hueso);color:var(--txt);border-color:var(--borde)}
input::placeholder,textarea::placeholder{color:var(--txt-3)}
.bt{background:var(--arena-hueso);color:var(--titulo);border-color:var(--titulo)}
.bt:hover:not(:disabled){background:var(--arena)}
.bt.rosa{background:var(--fucsia);border-color:var(--fucsia);color:#fff}
.segm{background:var(--arena);border-color:var(--borde)}
.segm button{color:var(--txt-2)}
.segm button[aria-pressed="true"]{background:var(--arena-hueso);color:var(--titulo)}
.aviso{background:var(--arena);border-color:var(--borde);color:var(--txt)}

/* ---- el interruptor de tema ---- */
.tema{display:inline-flex;align-items:center;gap:0;background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.3);border-radius:999px;padding:3px}
.tema button{width:30px;height:26px;border:0;background:transparent;border-radius:999px;
  display:grid;place-items:center;cursor:pointer;color:#fff;opacity:.6;transition:all .15s}
.tema button[aria-pressed="true"]{background:var(--arena-hueso);color:var(--p-azul);opacity:1}
.tema svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.tema.suelto{background:var(--arena);border-color:var(--borde)}
.tema.suelto button{color:var(--txt-2)}
.tema.suelto button[aria-pressed="true"]{background:var(--tinta);color:#fff}

/* ---- el logo se reduce con suavizado, no a saltos ---- */
.logo,.logo-grande,img.logo{image-rendering:auto}

/* La cabecera azul lleva siempre texto claro, pase lo que pase debajo */
header,header h1,header h1 span,header p,header .eyeb,header a,header b,header small,
.hero,.hero *{color:var(--sobre-oscuro)}
header h1 span,header .eyeb{color:var(--oro)}
.tema button[aria-pressed="true"]{color:var(--p-azul)}

/* ---- últimos ajustes de contraste en modo oscuro ---- */
html[data-tema="oscuro"]{ --fucsia:#4E90E0; --mar:#8FC2EA; }
html[data-tema="oscuro"] .bt.on,
html[data-tema="oscuro"] .bt[aria-pressed="true"]{background:var(--p-claro);color:#0B2340;border-color:var(--p-claro)}
html[data-tema="oscuro"] .bt.rosa{background:var(--p-claro);border-color:var(--p-claro);color:#0B2340}
html[data-tema="oscuro"] .bt.rosa:hover:not(:disabled){background:#A9D3F0;border-color:#A9D3F0}
html[data-tema="oscuro"] #nbBar button,
html[data-tema="oscuro"] #nbEnc .pie button{background:var(--arena-hueso);color:var(--titulo);border-color:var(--borde)}
html[data-tema="oscuro"] #nbBar button.on,
html[data-tema="oscuro"] #nbEnc .pie button.ppal{background:var(--p-claro);color:#0B2340;border-color:var(--p-claro)}
html[data-tema="oscuro"] #nbEnc .caja{background:var(--arena-hueso)}
html[data-tema="oscuro"] #nbEstado{background:var(--arena);color:var(--txt-2)}
html[data-tema="oscuro"] .segm button[aria-pressed="true"]{color:var(--titulo)}
html[data-tema="oscuro"] .atras{color:var(--oro);border-color:var(--oro)}
/* El azul de acción no se usa como texto en oscuro: ahí manda el claro */
html[data-tema="oscuro"] [style*="color:var(--fucsia)"],
html[data-tema="oscuro"] .fucsia,html[data-tema="oscuro"] .precio,
html[data-tema="oscuro"] .cifra,html[data-tema="oscuro"] .dim{color:var(--p-claro)!important}
html[data-tema="oscuro"] .atras:hover{background:var(--oro);color:#0B2340}

/* El pie lleva su propia banda azul, como la cabecera */
footer{background:#104186;color:#CFE0F2;margin-top:auto}
html[data-tema="oscuro"] footer{background:#0D3268}
footer *{color:#CFE0F2}
footer a{color:#9FD0F0}
footer code,footer b{color:#fff}
</style>
</head>
<body>
<div class="tema suelto" aria-label="Tema" style="position:fixed;top:14px;right:16px;z-index:200"></div>

<div class="hero"><div class="wrap">
  <p class="marca">POKÉMON · DUNGEONS &amp; DRAGONS 5E</p>
  <img src="logo.png" alt="" class="logo-grande">
  <h1>Región de<span>Nubia</span></h1>
  <p>Ocho ciudades, tres pueblos y una montaña nevada que nace al borde del mar.</p>
</div></div>
<div class="vueltiao"></div>

<main><div class="wrap" id="app">
  <div class="vacio"><span class="cargando"></span> Conectando…</div>
</div></main>

<footer>Contenido de fans. Sin relación con Nintendo, Game Freak ni Wizards of the Coast.</footer>

<script src="nubia-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CFG = window.NUBIA || {};
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb = null, yo = null;
const aviso = html => `<div class="aviso">${html}</div>`;

async function arrancar(){
  if(!CFG.SUPABASE_URL || !CFG.SUPABASE_KEY){
    $('#app').innerHTML = aviso(
      '<b>Falta la configuración.</b> Abre <code>nubia-config.js</code> y pega la URL y la clave anónima '
      + 'de tu proyecto de Supabase. Sin eso no hay cuentas ni partidas guardadas.')
      + `<div class="herr">
           <a href="nubia-tablero.html"><b>ENTRAR SIN CUENTA</b><span>El tablero funciona igual, pero nada se guarda.</span></a>
         </div>`;
    return;
  }
  if(!window.supabase){
    $('#app').innerHTML = aviso('<b>Sin conexión.</b> No cargó la librería de Supabase. Revisa tu internet y recarga.');
    return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
  sb.auth.onAuthStateChange((_e, s) => { yo = s?.user || null; pintar(); });
  const { data:{ session } } = await sb.auth.getSession();
  yo = session?.user || null;
  pintar();
}

function pintar(){ yo ? vistaMesas() : vistaEntrar(); }

function vistaEntrar(){
  $('#app').innerHTML = `
    <div class="sesion">
      <h2>ENTRAR A LA MESA</h2>
      <p>Necesitas una cuenta para que se guarden tu Pokédex, tus fichas y las partidas en las que juegas. Se usa tu cuenta de Google y no se guarda ninguna contraseña.</p>
      <button class="google" id="entrar">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.4 5.4 2.5 13.2l7.9 6.2C12.3 13.2 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.7 7l7.6 5.9c4.4-4.1 6.8-10.1 6.8-17.4z"/>
          <path fill="#FBBC05" d="M10.4 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.8l7.9-6.2z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.7-3.7-13.6-9.9l-7.9 6.2C6.4 42.6 14.6 48 24 48z"/>
        </svg>
        CONTINUAR CON GOOGLE
      </button>
    </div>`;
  $('#entrar').onclick = async ()=>{
    const { error } = await sb.auth.signInWithOAuth({
      provider:'google',
      options:{ redirectTo: location.origin + location.pathname }
    });
    if(error) $('#app').insertAdjacentHTML('afterbegin', aviso('<b>No se pudo abrir el acceso.</b> '+esc(error.message)));
  };
}

function vistaMesas(){
  const nombre = yo.user_metadata?.full_name || yo.email || 'Entrenador';
  const avatar = yo.user_metadata?.avatar_url || '';
  $('#app').innerHTML = `
    <div class="usuario">
      <div class="quien">
        ${avatar?`<img src="${esc(avatar)}" alt="">`:''}
        <div><b>${esc(nombre)}</b><small>${esc(yo.email||'')}</small></div>
      </div>
      <button class="bt" id="salir">CERRAR SESIÓN</button>
    </div>

    <div class="acciones">
      <div class="accion">
        <h3>CREAR PARTIDA</h3>
        <p>Serás el director. Se genera un código de seis letras para repartir a tu mesa.</p>
        <div class="fila">
          <input id="nomPartida" maxlength="40" placeholder="La sombra de El Dorado">
          <button class="bt solido" id="crear">CREAR</button>
        </div>
      </div>
      <div class="accion">
        <h3>UNIRSE CON CÓDIGO</h3>
        <p>Escribe el código que te pasó tu director. Solo hace falta una vez.</p>
        <div class="fila">
          <input id="codigo" maxlength="6" placeholder="ABC234" style="text-transform:uppercase">
          <button class="bt solido" id="unirse">ENTRAR</button>
        </div>
      </div>
    </div>

    <h2 class="sec">TUS MESAS</h2>
    <div class="mesas" id="mesas"><div class="vacio"><span class="cargando"></span> Buscando…</div></div>
    <div id="herrDM"></div>`;

  $('#salir').onclick  = async ()=>{ await sb.auth.signOut(); yo=null; pintar(); };
  $('#crear').onclick  = crearPartida;
  $('#unirse').onclick = unirse;
  $('#codigo').addEventListener('keydown', e=>{ if(e.key==='Enter') unirse(); });
  $('#nomPartida').addEventListener('keydown', e=>{ if(e.key==='Enter') crearPartida(); });
  $('#mesas').addEventListener('click', clicMesa);
  listarMesas();
}

async function clicMesa(e){
  const borrar = e.target.closest('[data-borrar]');
  if(borrar){
    await eliminarPartida(borrar.dataset.borrar, borrar.dataset.nombre);
    return;
  }
  const en = e.target.closest('[data-entrar]');
  if(en){
    location.href = 'nubia-tablero.html#sala=' + en.dataset.entrar + (en.dataset.dm==='1' ? '&dm=1' : '');
    return;
  }
  const cp = e.target.closest('[data-copiar]');
  if(cp){
    try{ await navigator.clipboard.writeText(cp.dataset.copiar); cp.textContent='COPIADO'; }
    catch{ cp.textContent = cp.dataset.copiar; }
    setTimeout(()=>cp.textContent='COPIAR CÓDIGO', 2200);
  }
}

async function listarMesas(){
  const { data, error } = await sb.from('partidas')
    .select('id,codigo,nombre,director,actualizado')
    .order('actualizado', { ascending:false });

  const c = $('#mesas');
  if(error){
    c.innerHTML = aviso('<b>No se pudieron cargar las mesas.</b> ' + esc(error.message)
      + ' Puede que falte correr <code>esquema.sql</code> en el editor SQL de Supabase.');
    return;
  }
  if(!data || !data.length){
    c.innerHTML = '<div class="vacio">Todavía no tienes mesas. Crea una partida o únete con un código.</div>';
    $('#herrDM').innerHTML = '';
    return;
  }
  c.innerHTML = data.map(p=>{
    const dm = p.director === yo.id;
    const cuando = new Date(p.actualizado).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
    return `<div class="mesa">
      <div class="codigo">${esc(p.codigo)}</div>
      <div>
        <h3>${esc(p.nombre)}<span class="rol ${dm?'dm':''}">${dm?'DIRECTOR':'JUGADOR'}</span></h3>
        <div class="meta">Última sesión el ${cuando}</div>
      </div>
      <div class="btns">
        ${dm?`<button class="bt" data-copiar="${esc(p.codigo)}">COPIAR CÓDIGO</button>
        <button class="bt" data-borrar="${esc(p.id)}" data-nombre="${esc(p.nombre)}">ELIMINAR</button>`:''}
        <button class="bt solido" data-entrar="${esc(p.codigo)}" data-dm="${dm?1:0}">ENTRAR</button>
      </div>
    </div>`;
  }).join('');

  $('#herrDM').innerHTML = data.some(p=>p.director === yo.id) ? `
    <h2 class="sec" style="margin-top:34px">HERRAMIENTAS DEL DIRECTOR</h2>
    <div class="herr">
      <a href="nubia-codex.html"><b>CÓDICE</b><span>Mundo, NPC, gimnasios y campaña</span></a>
      <a href="nubia-rutas.html"><b>ATLAS DE RUTAS</b><span>Rutas, Camino Victoria y zonas legendarias</span></a>
      <a href="nubia-planos.html"><b>PLANOS</b><span>Medidas y salidas de cada mapa</span></a>
      <a href="nubia-encuentros.html"><b>ENCUENTROS</b><span>Tablas por zona</span></a>
      <a href="nubia-dados.html"><b>MESA DE DADOS</b><span>Tirador aparte</span></a>
    </div>` : '';
}

async function eliminarPartida(id, nombre){
  if(!confirm('¿Eliminar la mesa "'+nombre+'"? Esta acción no se puede deshacer.')) return;
  const { error } = await sb.from('partidas').delete().eq('id', id);
  if(error){
    $('#app').insertAdjacentHTML('afterbegin', aviso('<b>No se pudo eliminar la mesa.</b> '+esc(error.message)));
    return;
  }
  listarMesas();
}

function codigoNuevo(){
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // sin I, O, 0 ni 1
  return Array.from({length:6}, ()=>abc[Math.floor(Math.random()*abc.length)]).join('');
}

async function crearPartida(){
  const nom = $('#nomPartida').value.trim() || 'Partida de Nubia';
  const b = $('#crear'); b.disabled = true; b.textContent = 'CREANDO…';
  let error = null;
  for(let i=0; i<5; i++){
    const r = await sb.from('partidas').insert({ codigo: codigoNuevo(), nombre: nom, director: yo.id });
    error = r.error;
    if(!error) break;
    if(!String(error.message).toLowerCase().includes('duplicate')) break;
  }
  b.disabled = false; b.textContent = 'CREAR';
  if(error){ $('#app').insertAdjacentHTML('afterbegin', aviso('<b>No se pudo crear.</b> '+esc(error.message))); return; }
  $('#nomPartida').value = '';
  listarMesas();
}

async function unirse(){
  const cod = $('#codigo').value.trim().toUpperCase();
  if(cod.length < 4) return;
  const b = $('#unirse'); b.disabled = true; b.textContent = 'ENTRANDO…';
  const { error } = await sb.rpc('unirse_partida', { p_codigo: cod });
  b.disabled = false; b.textContent = 'ENTRAR';
  if(error){ $('#app').insertAdjacentHTML('afterbegin', aviso('<b>No se pudo entrar.</b> '+esc(error.message))); return; }
  $('#codigo').value = '';
  listarMesas();
}

arrancar();
</script>

<script>
/* ---- tema claro / oscuro ----
   Se recuerda en este navegador y, si nunca se eligió, sigue al sistema. */
(function(){
  const LL = 'nubia-tema';
  function poner(t, guardar){
    document.documentElement.setAttribute('data-tema', t);
    if(guardar){ try{ localStorage.setItem(LL, t); }catch{} }
    document.querySelectorAll('.tema [data-tema-bt]').forEach(b=>
      b.setAttribute('aria-pressed', String(b.dataset.temaBt === t)));
  }
  let guardado = null;
  try{ guardado = localStorage.getItem(LL); }catch{}
  const sistema = matchMedia('(prefers-color-scheme: dark)');
  poner(guardado || (sistema.matches ? 'oscuro' : 'claro'), false);
  sistema.addEventListener('change', e=>{
    let g = null; try{ g = localStorage.getItem(LL); }catch{}
    if(!g) poner(e.matches ? 'oscuro' : 'claro', false);
  });
  const SOL  = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>';
  const LUNA = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
  function montar(){
    document.querySelectorAll('.tema').forEach(c=>{
      if(c.dataset.listo) return;
      c.dataset.listo = '1';
      c.innerHTML = '<button data-tema-bt="claro" title="Modo claro" aria-label="Modo claro">'+SOL+'</button>'
                  + '<button data-tema-bt="oscuro" title="Modo oscuro" aria-label="Modo oscuro">'+LUNA+'</button>';
    });
    poner(document.documentElement.getAttribute('data-tema'), false);
  }
  document.addEventListener('click', e=>{
    const b = e.target.closest('[data-tema-bt]');
    if(b) poner(b.dataset.temaBt, true);
  });
  if(document.readyState === 'loading') addEventListener('DOMContentLoaded', montar);
  else montar();
})();
</script>
